# ServiceAccount for scaling-monitor-service
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scaling-monitor-sa
  namespace: dropmate
  labels:
    app: scaling-monitor-service
---
# Role: Permissions to watch HPA and get pod/metrics
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scaling-monitor-role
  namespace: dropmate
  labels:
    app: scaling-monitor-service
rules:
  # Watch HPA resources (autoscaling/v2)
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]

  # Read pod status
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  # Read metrics (if metrics-server is installed)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
# RoleBinding: Bind role to service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scaling-monitor-rolebinding
  namespace: dropmate
  labels:
    app: scaling-monitor-service
subjects:
  - kind: ServiceAccount
    name: scaling-monitor-sa
    namespace: dropmate
roleRef:
  kind: Role
  name: scaling-monitor-role
  apiGroup: rbac.authorization.k8s.io
